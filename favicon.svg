<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#FFE66D"/>
    </linearGradient>
  </defs>
  <!-- Chapiteau de festival -->
  <polygon points="20,70 80,70 60,30 40,30" fill="url(#tentGradient)" stroke="#292F36" stroke-width="2"/>
  <rect x="35" y="30" width="30" height="40" fill="#292F36"/>
  <!-- Drapeau sur le chapiteau -->
  <polygon points="50,30 50,15 65,22" fill="#FF6B6B" stroke="#292F36" stroke-width="1"/>
  <text x="50" y="20" font-size="8" text-anchor="middle" fill="white" font-family="Arial">L</text>
  <!-- Étoiles autour -->
  <circle cx="25" cy="25" r="3" fill="#FFE66D"/>
  <circle cx="75" cy="20" r="2" fill="#FFE66D"/>
  <circle cx="80" cy="45" r="2" fill="#4ECDC4"/>
</svg>
